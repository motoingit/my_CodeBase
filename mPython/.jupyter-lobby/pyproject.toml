[project]
name = "ml-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "motoingit", email = "mohitsinghinsecondary@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
]

[project.scripts]
ml-ai = "ml_ai:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]
